<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyChecker</title>

<style>
@font-face {
    font-family: KeyCheckerFont;
    src: url("assets/font.ttf") format("truetype");
}

* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: KeyCheckerFont, "Segoe UI", Arial, sans-serif;
    color: white;
    background:
        linear-gradient(
            135deg,
            #300642 0%,
            #170a3b 50%,
            #041936 100%
        );
}

/* =========================================================
   MAIN
========================================================= */

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-width: 1100px;
    min-height: 650px;
    overflow: hidden;
}

#title {
    position: absolute;
    top: 25px;
    left: 0;
    width: 1150px;
    height: 70px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 38px;
    font-weight: bold;
}

/* =========================================================
   KEYBOARD
========================================================= */

#keyboard {
    position: absolute;
    left: 25px;
    top: 0;
    width: 1060px;
    height: 520px;
}

.key {
    position: absolute;

    height: 54px;

    display: flex;
    justify-content: center;
    align-items: center;

    border: 2px solid white;
    border-radius: 20px;

    color: white;
    background: transparent;

    font-size: 17px;
    font-weight: bold;

    transition:
        background-color 0.03s ease,
        color 0.03s ease,
        transform 0.03s ease;
}

.key.pressed {
    color: black;
    background: white;
}

.key.pressed::after {
    content: "";
}

/* =========================================================
   SOCIAL BUTTONS
========================================================= */

#socialButtons {
    position: fixed;
    left: 25px;
    bottom: 14px;

    display: flex;
    gap: 10px;
}

.social {
    width: 135px;
    height: 46px;

    display: flex;
    align-items: center;

    padding: 0 8px;

    border: 2px solid white;
    border-radius: 20px;

    color: white;
    background: rgba(22, 15, 50, 0.72);

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background-color 0.15s ease,
        transform 0.15s ease;
}

.social:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-2px);
}

.social img {
    width: 28px;
    height: 28px;
    object-fit: contain;
    margin-right: 5px;
}

.social span {
    flex: 1;
    text-align: center;
}

/* =========================================================
   COPYRIGHT
========================================================= */

#copyright {
    position: fixed;
    right: 22px;
    bottom: 12px;

    height: 30px;

    display: flex;
    align-items: center;

    font-size: 15px;
    color: white;
}

/* =========================================================
   GAMING MOUSE
========================================================= */

#mouseArea {
    position: absolute;

    left: 1325px;
    top: 155px;

    width: 430px;
    height: 570px;
}

#mouse {
    position: absolute;

    left: 0;
    top: 0;

    width: 190px;
    height: 330px;

    background: #111827;

    border: 2.5px solid white;
    border-radius: 82px;

    overflow: visible;
}

/* =========================================================
   MOUSE BUTTONS
========================================================= */

.mouseButton {
    position: absolute;

    top: 8px;

    width: 88px;
    height: 127px;

    border: 1.5px solid white;
    border-radius: 22px;

    background: transparent;

    transition:
        background-color 0.04s ease,
        color 0.04s ease;
}

#leftMouse {
    left: 8px;
}

#rightMouse {
    right: 8px;
}

.mouseButton.pressed {
    background: #8b5cf6;
}

#mouseDivider {
    position: absolute;

    left: 50%;
    top: 10px;

    width: 1.5px;
    height: 125px;

    background: white;

    transform: translateX(-50%);
}

/* =========================================================
   WHEEL
========================================================= */

#mouseWheel {
    position: absolute;

    left: 80px;
    top: 54px;

    width: 30px;
    height: 58px;

    border: 1.5px solid white;
    border-radius: 12px;

    background: #a855f7;

    overflow: hidden;

    transition: background-color 0.05s ease;
}

#mouseWheel.pressed {
    background: #8b5cf6;
}

.wheelGroove {
    position: absolute;

    left: 7px;

    width: 16px;
    height: 1px;

    background: white;
}

/* =========================================================
   SIDE BUTTONS
========================================================= */

.sideButton {
    position: absolute;

    left: -43px;

    width: 35px;
    height: 72px;

    border: 1.5px solid white;
    border-radius: 10px;

    background: transparent;

    transition: background-color 0.05s ease;
}

.sideButton.pressed {
    background: #8b5cf6;
}

#sideBack {
    top: 120px;
}

#sideForward {
    top: 205px;
}

/* =========================================================
   MOUSE LABELS / LINES
========================================================= */

.mouseLabel {
    position: absolute;

    color: white;

    font-size: 14px;
    font-weight: bold;

    white-space: nowrap;
}

.mouseLine {
    position: absolute;

    height: 1.5px;

    background: rgba(255, 255, 255, 0.7);

    transform-origin: left center;
}

.mouseDot {
    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.7);
}

/* LEFT CLICK */

#leftLine {
    left: 35px;
    top: 55px;

    width: 92px;

    transform:
        translate(-55px, -20px)
        rotate(193deg);
}

#leftDot {
    left: -58px;
    top: 32px;
}

#leftLabel {
    left: -180px;
    top: 10px;

    width: 120px;
    text-align: center;
}

/* RIGHT CLICK */

#rightLine {
    left: 155px;
    top: 55px;

    width: 160px;

    transform:
        translate(0, -20px)
        rotate(-7deg);
}

#rightDot {
    left: 278px;
    top: 32px;
}

#rightLabel {
    left: 270px;
    top: 10px;

    width: 125px;
    text-align: center;
}

/* MIDDLE CLICK */

#middleLine {
    left: 95px;
    top: 112px;

    width: 93px;

    transform-origin: left center;
    transform: rotate(90deg);
}

#middleDot {
    left: 92px;
    top: 198px;
}

#middleLabel {
    left: 30px;
    top: 210px;

    width: 130px;
    text-align: center;
}

/* SIDE 1 */

#sideLine1 {
    left: -43px;
    top: 156px;

    width: 62px;
}

#sideDot1 {
    left: -108px;
    top: 153px;
}

#sideLabel1 {
    left: -250px;
    top: 132px;

    width: 140px;
    text-align: center;
}

/* SIDE 2 */

#sideLine2 {
    left: -43px;
    top: 241px;

    width: 62px;
}

#sideDot2 {
    left: -108px;
    top: 238px;
}

#sideLabel2 {
    left: -250px;
    top: 217px;

    width: 140px;
    text-align: center;
}

/* =========================================================
   SCROLL ARROWS
========================================================= */

#scrollArea {
    position: absolute;

    left: 238px;
    top: 115px;

    width: 140px;
    height: 300px;
}

.scrollArrow {
    position: absolute;

    left: 68px;

    width: 3px;
    height: 36px;

    background: rgba(255,255,255,0.7);

    border-radius: 2px;

    transition:
        background-color 0.08s ease,
        box-shadow 0.08s ease;
}

.scrollArrow::before,
.scrollArrow::after {
    content: "";

    position: absolute;

    width: 13px;
    height: 3px;

    background: currentColor;

    border-radius: 2px;
}

.scrollArrow.up {
    top: 35px;

    color: rgba(255,255,255,0.7);
}

.scrollArrow.up::before {
    left: -2px;
    top: 0;

    transform: rotate(-45deg);
}

.scrollArrow.up::after {
    right: -2px;
    top: 0;

    transform: rotate(45deg);
}

.scrollArrow.down {
    top: 92px;

    color: rgba(255,255,255,0.7);
}

.scrollArrow.down::before {
    left: -2px;
    bottom: 0;

    transform: rotate(45deg);
}

.scrollArrow.down::after {
    right: -2px;
    bottom: 0;

    transform: rotate(-45deg);
}

.scrollArrow.activeUp {
    background: #22c55e;
    color: #22c55e;

    box-shadow: 0 0 12px #22c55e;
}

.scrollArrow.activeDown {
    background: #ef4444;
    color: #ef4444;

    box-shadow: 0 0 12px #ef4444;
}

.scrollText {
    position: absolute;

    width: 130px;

    left: 0;

    text-align: center;

    color: rgba(255,255,255,0.7);

    font-size: 14px;
    font-weight: bold;
}

#scrollUpText {
    top: 0;
}

#scrollDownText {
    top: 215px;
}

#scrollDownArrow {
    top: 92px;
}

/* =========================================================
   MOUSE TITLE / STATUS
========================================================= */

#mouseTitle {
    position: absolute;

    left: -100px;
    top: 340px;

    width: 390px;

    text-align: center;

    font-size: 14px;
    font-weight: bold;
}

#mouseStatus {
    position: absolute;

    left: -30px;
    top: 378px;

    width: 250px;

    text-align: center;

    font-size: 14px;
    font-weight: bold;

    transition: color 0.1s ease;
}

/* =========================================================
   RESPONSIVE SCALING
========================================================= */

@media (max-width: 1400px) {
    #app {
        transform-origin: top left;
        transform: scale(
            calc(100vw / 1550)
        );
        width: 1550px;
        height: 700px;
    }
}

@media (max-height: 700px) {
    #app {
        transform-origin: top left;
        transform: scale(
            min(
                calc(100vw / 1550),
                calc(100vh / 700)
            )
        );

        width: 1550px;
        height: 700px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="title">
        KeyChecker
    </div>

    <div id="keyboard"></div>

    <!-- =====================================================
         GAMING MOUSE
    ====================================================== -->

    <div id="mouseArea">

        <div id="mouse">

            <div
                id="leftMouse"
                class="mouseButton">
            </div>

            <div
                id="rightMouse"
                class="mouseButton">
            </div>

            <div id="mouseDivider"></div>

            <div id="mouseWheel">
                <div
                    class="wheelGroove"
                    style="top:10px">
                </div>

                <div
                    class="wheelGroove"
                    style="top:19px">
                </div>

                <div
                    class="wheelGroove"
                    style="top:28px">
                </div>

                <div
                    class="wheelGroove"
                    style="top:37px">
                </div>

                <div
                    class="wheelGroove"
                    style="top:46px">
                </div>
            </div>

            <div
                id="sideBack"
                class="sideButton">
            </div>

            <div
                id="sideForward"
                class="sideButton">
            </div>

            <!-- LEFT LABEL -->

            <div
                id="leftLine"
                class="mouseLine">
            </div>

            <div
                id="leftDot"
                class="mouseDot">
            </div>

            <div
                id="leftLabel"
                class="mouseLabel">
                LEFT CLICK
            </div>

            <!-- RIGHT LABEL -->

            <div
                id="rightLine"
                class="mouseLine">
            </div>

            <div
                id="rightDot"
                class="mouseDot">
            </div>

            <div
                id="rightLabel"
                class="mouseLabel">
                RIGHT CLICK
            </div>

            <!-- MIDDLE LABEL -->

            <div
                id="middleLine"
                class="mouseLine">
            </div>

            <div
                id="middleDot"
                class="mouseDot">
            </div>

            <div
                id="middleLabel"
                class="mouseLabel">
                MIDDLE CLICK
            </div>

            <!-- SIDE 1 -->

            <div
                id="sideLine1"
                class="mouseLine">
            </div>

            <div
                id="sideDot1"
                class="mouseDot">
            </div>

            <div
                id="sideLabel1"
                class="mouseLabel">
                SIDE BUTTON 1
            </div>

            <!-- SIDE 2 -->

            <div
                id="sideLine2"
                class="mouseLine">
            </div>

            <div
                id="sideDot2"
                class="mouseDot">
            </div>

            <div
                id="sideLabel2"
                class="mouseLabel">
                SIDE BUTTON 2
            </div>

        </div>

        <!-- SCROLL -->

        <div id="scrollArea">

            <div
                id="scrollUpText"
                class="scrollText">
                SCROLL UP
            </div>

            <div
                id="scrollUpArrow"
                class="scrollArrow up">
            </div>

            <div
                id="scrollDownArrow"
                class="scrollArrow down">
            </div>

            <div
                id="scrollDownText"
                class="scrollText">
                SCROLL DOWN
            </div>

        </div>

        <div id="mouseTitle">
            GAMING MOUSE
        </div>

        <div id="mouseStatus">
            READY
        </div>

    </div>

    <!-- =====================================================
         SOCIAL BUTTONS
    ====================================================== -->

    <div id="socialButtons">

        <div
            class="social"
            data-url="https://github.com/WallHackCheats">

            <img
                src="github.png"
                alt="GitHub">

            <span>Github</span>

        </div>

        <div
            class="social"
            data-url="https://x.com/TwistedGamingX1">

            <img
                src="discord.png"
                alt="Discord">

            <span>Discord</span>

        </div>

        <div
            class="social"
            data-url="https://www.youtube.com/@TwistedGamingOfficial1">

            <img
                src="youtube.png"
                alt="YouTube">

            <span>YouTube</span>

        </div>

    </div>

    <div id="copyright">
        WallHack © 2026 - Twisted0097
    </div>

</div>

<script>

/* =========================================================
   KEY DEFINITIONS
========================================================= */

const keyboard = document.getElementById("keyboard");

const keys = [];

function addKey(name, code, x, y, width) {

    const element = document.createElement("div");

    element.className = "key";

    element.textContent = name;

    element.style.left = x + "px";
    element.style.top = y + "px";
    element.style.width = width + "px";

    element.dataset.code = code;

    keyboard.appendChild(element);

    keys.push({
        name,
        code,
        element,
        pressed: false
    });
}


/* =========================================================
   CONSTANTS
========================================================= */

const K = 54;
const SPACING = 6;

const ROW_F = 125;
const ROW_NUMBER = 190;
const ROW_QWERTY = 250;
const ROW_HOME = 310;
const ROW_SHIFT = 370;
const ROW_BOTTOM = 430;

const START_X = 0;


/* =========================================================
   FUNCTION ROW
========================================================= */

let x = START_X;

addKey("ESC", "Escape", x, ROW_F, 70);

x += 86;

addKey("F1", "F1", x, ROW_F, K);
x += K + SPACING;

addKey("F2", "F2", x, ROW_F, K);
x += K + SPACING;

addKey("F3", "F3", x, ROW_F, K);
x += K + SPACING;

addKey("F4", "F4", x, ROW_F, K);

x += K + 16;

addKey("F5", "F5", x, ROW_F, K);
x += K + SPACING;

addKey("F6", "F6", x, ROW_F, K);
x += K + SPACING;

addKey("F7", "F7", x, ROW_F, K);
x += K + SPACING;

addKey("F8", "F8", x, ROW_F, K);

x += K + 16;

addKey("F9", "F9", x, ROW_F, K);
x += K + SPACING;

addKey("F10", "F10", x, ROW_F, K);
x += K + SPACING;

addKey("F11", "F11", x, ROW_F, K);
x += K + SPACING;

addKey("F12", "F12", x, ROW_F, K);

x += K + 20;

addKey("PRINT", "PrintScreen", x, ROW_F, 75);

x += 81;

addKey("SCROLL", "ScrollLock", x, ROW_F, 75);

x += 81;

addKey("PAUSE", "Pause", x, ROW_F, 75);


/* =========================================================
   NUMBER ROW
========================================================= */

x = START_X;

addKey("`", "Backquote", x, ROW_NUMBER, K);
x += K + SPACING;

const numberKeys = [
    ["1", "Digit1"],
    ["2", "Digit2"],
    ["3", "Digit3"],
    ["4", "Digit4"],
    ["5", "Digit5"],
    ["6", "Digit6"],
    ["7", "Digit7"],
    ["8", "Digit8"],
    ["9", "Digit9"],
    ["0", "Digit0"]
];

for (const [name, code] of numberKeys) {
    addKey(name, code, x, ROW_NUMBER, K);
    x += K + SPACING;
}

addKey("-", "Minus", x, ROW_NUMBER, K);
x += K + SPACING;

addKey("=", "Equal", x, ROW_NUMBER, K);
x += K + SPACING;

addKey(
    "BACKSPACE",
    "Backspace",
    x,
    ROW_NUMBER,
    108
);


/* =========================================================
   QWERTY ROW
========================================================= */

x = START_X;

addKey("TAB", "Tab", x, ROW_QWERTY, 82);

x += 88;

const qwerty = [
    ["Q", "KeyQ"],
    ["W", "KeyW"],
    ["E", "KeyE"],
    ["R", "KeyR"],
    ["T", "KeyT"],
    ["Y", "KeyY"],
    ["U", "KeyU"],
    ["I", "KeyI"],
    ["O", "KeyO"],
    ["P", "KeyP"],
    ["[", "BracketLeft"],
    ["]", "BracketRight"]
];

for (const [name, code] of qwerty) {
    addKey(name, code, x, ROW_QWERTY, K);
    x += K + SPACING;
}

addKey(
    "\\",
    "Backslash",
    x,
    ROW_QWERTY,
    82
);


/* =========================================================
   HOME ROW
========================================================= */

x = START_X;

addKey(
    "CAPS",
    "CapsLock",
    x,
    ROW_HOME,
    95
);

x += 101;

const homeKeys = [
    ["A", "KeyA"],
    ["S", "KeyS"],
    ["D", "KeyD"],
    ["F", "KeyF"],
    ["G", "KeyG"],
    ["H", "KeyH"],
    ["J", "KeyJ"],
    ["K", "KeyK"],
    ["L", "KeyL"],
    [";", "Semicolon"],
    ["'", "Quote"]
];

for (const [name, code] of homeKeys) {
    addKey(name, code, x, ROW_HOME, K);
    x += K + SPACING;
}

addKey(
    "ENTER",
    "Enter",
    x,
    ROW_HOME,
    108
);


/* =========================================================
   SHIFT ROW
========================================================= */

x = START_X;

addKey(
    "SHIFT",
    "ShiftLeft",
    x,
    ROW_SHIFT,
    125
);

x += 131;

const shiftKeys = [
    ["Z", "KeyZ"],
    ["X", "KeyX"],
    ["C", "KeyC"],
    ["V", "KeyV"],
    ["B", "KeyB"],
    ["N", "KeyN"],
    ["M", "KeyM"],
    [",", "Comma"],
    [".", "Period"],
    ["/", "Slash"]
];

for (const [name, code] of shiftKeys) {
    addKey(name, code, x, ROW_SHIFT, K);
    x += K + SPACING;
}

addKey(
    "SHIFT",
    "ShiftRight",
    x,
    ROW_SHIFT,
    125
);


/* =========================================================
   BOTTOM ROW
========================================================= */

x = START_X;

addKey(
    "CTRL",
    "ControlLeft",
    x,
    ROW_BOTTOM,
    80
);

x += 86;

addKey(
    "WIN",
    "MetaLeft",
    x,
    ROW_BOTTOM,
    65
);

x += 71;

addKey(
    "ALT",
    "AltLeft",
    x,
    ROW_BOTTOM,
    65
);

x += 71;

addKey(
    "SPACE",
    "Space",
    x,
    ROW_BOTTOM,
    365
);

x += 371;

addKey(
    "ALT",
    "AltRight",
    x,
    ROW_BOTTOM,
    65
);

x += 71;

addKey(
    "WIN",
    "MetaRight",
    x,
    ROW_BOTTOM,
    65
);

x += 71;

addKey(
    "MENU",
    "ContextMenu",
    x,
    ROW_BOTTOM,
    65
);

x += 71;

addKey(
    "CTRL",
    "ControlRight",
    x,
    ROW_BOTTOM,
    80
);


/* =========================================================
   NAVIGATION
========================================================= */

const NAV_X = 910;
const NAV_Y = 190;
const NAV_WIDTH = 72;

addKey("INS", "Insert", NAV_X, NAV_Y, NAV_WIDTH);

addKey(
    "HOME",
    "Home",
    NAV_X + 78,
    NAV_Y,
    NAV_WIDTH
);

addKey(
    "PGUP",
    "PageUp",
    NAV_X + 156,
    NAV_Y,
    NAV_WIDTH
);

addKey(
    "DEL",
    "Delete",
    NAV_X,
    NAV_Y + 60,
    NAV_WIDTH
);

addKey(
    "END",
    "End",
    NAV_X + 78,
    NAV_Y + 60,
    NAV_WIDTH
);

addKey(
    "PGDN",
    "PageDown",
    NAV_X + 156,
    NAV_Y + 60,
    NAV_WIDTH
);


/* =========================================================
   ARROW KEYS
========================================================= */

const ARROW_X = 988;
const ARROW_Y = 330;
const ARROW_WIDTH = 72;

addKey(
    "UP",
    "ArrowUp",
    ARROW_X,
    ARROW_Y,
    ARROW_WIDTH
);

addKey(
    "LEFT",
    "ArrowLeft",
    ARROW_X - 78,
    ARROW_Y + 60,
    ARROW_WIDTH
);

addKey(
    "DOWN",
    "ArrowDown",
    ARROW_X,
    ARROW_Y + 60,
    ARROW_WIDTH
);

addKey(
    "RIGHT",
    "ArrowRight",
    ARROW_X + 78,
    ARROW_Y + 60,
    ARROW_WIDTH
);


/* =========================================================
   KEYBOARD INPUT
========================================================= */

const currentlyPressed = new Set();

function setKey(code, pressed) {

    for (const key of keys) {

        if (key.code === code) {

            key.pressed = pressed;

            key.element.classList.toggle(
                "pressed",
                pressed
            );
        }
    }
}

document.addEventListener("keydown", event => {

    /*
     * Ignore auto-repeat so the visual state
     * doesn't constantly get recreated.
     */

    if (!currentlyPressed.has(event.code)) {

        currentlyPressed.add(event.code);

        setKey(event.code, true);
    }

    /*
     * Prevent browser shortcuts from interfering
     * with the keyboard tester.
     */

    if (
        event.code === "Space" ||
        event.code === "Tab" ||
        event.code === "ArrowUp" ||
        event.code === "ArrowDown" ||
        event.code === "ArrowLeft" ||
        event.code === "ArrowRight"
    ) {
        event.preventDefault();
    }

}, true);


document.addEventListener("keyup", event => {

    currentlyPressed.delete(event.code);

    setKey(event.code, false);

}, true);


/*
 * If the browser loses focus, release all keys.
 */

window.addEventListener("blur", () => {

    currentlyPressed.clear();

    for (const key of keys) {
        key.pressed = false;
        key.element.classList.remove("pressed");
    }

});


/* =========================================================
   MOUSE TESTER
========================================================= */

const leftMouse =
    document.getElementById("leftMouse");

const rightMouse =
    document.getElementById("rightMouse");

const mouseWheel =
    document.getElementById("mouseWheel");

const sideBack =
    document.getElementById("sideBack");

const sideForward =
    document.getElementById("sideForward");

const mouseStatus =
    document.getElementById("mouseStatus");

const scrollUpArrow =
    document.getElementById("scrollUpArrow");

const scrollDownArrow =
    document.getElementById("scrollDownArrow");


let mouseStates = {
    left: false,
    right: false,
    middle: false,
    sideBack: false,
    sideForward: false
};


function updateMouseStatus() {

    if (mouseStates.left) {

        mouseStatus.textContent =
            "LEFT CLICK";

    }

    else if (mouseStates.right) {

        mouseStatus.textContent =
            "RIGHT CLICK";

    }

    else if (mouseStates.middle) {

        mouseStatus.textContent =
            "MIDDLE CLICK";

    }

    else if (mouseStates.sideBack) {

        mouseStatus.textContent =
            "SIDE BUTTON 1";

    }

    else if (mouseStates.sideForward) {

        mouseStatus.textContent =
            "SIDE BUTTON 2";

    }

    else if (
        scrollUpArrow.classList.contains("activeUp")
    ) {

        mouseStatus.textContent =
            "SCROLLING UP";

    }

    else if (
        scrollDownArrow.classList.contains("activeDown")
    ) {

        mouseStatus.textContent =
            "SCROLLING DOWN";

    }

    else {

        mouseStatus.textContent =
            "READY";

    }
}


function setMouseButton(
    button,
    state,
    element
) {

    mouseStates[button] = state;

    element.classList.toggle(
        "pressed",
        state
    );

    updateMouseStatus();
}


/* =========================================================
   MOUSE DOWN
========================================================= */

document.addEventListener("mousedown", event => {

    /*
     * Do not let clicking the social buttons
     * activate the mouse tester.
     */

    if (
        event.target.closest(".social")
    ) {
        return;
    }


    if (event.button === 0) {

        setMouseButton(
            "left",
            true,
            leftMouse
        );

    }

    else if (event.button === 1) {

        setMouseButton(
            "middle",
            true,
            mouseWheel
        );

    }

    else if (event.button === 2) {

        setMouseButton(
            "right",
            true,
            rightMouse
        );

        event.preventDefault();
    }

});


/* =========================================================
   MOUSE UP
========================================================= */

document.addEventListener("mouseup", event => {

    if (event.button === 0) {

        setMouseButton(
            "left",
            false,
            leftMouse
        );

    }

    else if (event.button === 1) {

        setMouseButton(
            "middle",
            false,
            mouseWheel
        );

    }

    else if (event.button === 2) {

        setMouseButton(
            "right",
            false,
            rightMouse
        );

    }

});


/* =========================================================
   DISABLE CONTEXT MENU
========================================================= */

document.addEventListener(
    "contextmenu",
    event => event.preventDefault()
);


/* =========================================================
   SIDE MOUSE BUTTONS
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        /*
         * Browser button 3 = XBUTTON1
         * Browser button 4 = XBUTTON2
         */

        if (event.button === 3) {

            setMouseButton(
                "sideBack",
                true,
                sideBack
            );

        }

        else if (event.button === 4) {

            setMouseButton(
                "sideForward",
                true,
                sideForward
            );

        }

    }
);


document.addEventListener(
    "mouseup",
    event => {

        if (event.button === 3) {

            setMouseButton(
                "sideBack",
                false,
                sideBack
            );

        }

        else if (event.button === 4) {

            setMouseButton(
                "sideForward",
                false,
                sideForward
            );

        }

    }
);


/* =========================================================
   MOUSE WHEEL
========================================================= */

let scrollTimeout = null;

function showScroll(direction) {

    clearTimeout(scrollTimeout);

    scrollUpArrow.classList.remove(
        "activeUp"
    );

    scrollDownArrow.classList.remove(
        "activeDown"
    );


    if (direction === "up") {

        scrollUpArrow.classList.add(
            "activeUp"
        );

        mouseStatus.textContent =
            "SCROLLING UP";

    }

    else {

        scrollDownArrow.classList.add(
            "activeDown"
        );

        mouseStatus.textContent =
            "SCROLLING DOWN";

    }


    scrollTimeout = setTimeout(() => {

        scrollUpArrow.classList.remove(
            "activeUp"
        );

        scrollDownArrow.classList.remove(
            "activeDown"
        );

        updateMouseStatus();

    }, 180);

}


document.addEventListener(
    "wheel",
    event => {

        if (event.deltaY < 0) {

            showScroll("up");

        }

        else if (event.deltaY > 0) {

            showScroll("down");

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   SOCIAL LINKS
========================================================= */

document.querySelectorAll(
    ".social"
).forEach(button => {

    button.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            const url =
                button.dataset.url;

            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );

        }
    );

});


/* =========================================================
   PREVENT DRAGGING
========================================================= */

document.addEventListener(
    "dragstart",
    event => event.preventDefault()
);

</script>

</body>
</html>
